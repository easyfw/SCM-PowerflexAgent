; ===========================================================================
;  SCM-PowerFlex Agent Service - Configuration
;  Target: Morbidelli PWX100 + TPA Albatros 3.1.9 SP 9c
;  Place this file beside SCM_PowerflexAgent.exe
; ===========================================================================

[Albatros]
; Albatros 설치 루트 경로.
; 일반적으로 C:\Albatros\ 또는 D:\Albatros\.
; 사용자 PC에서는 02_Installed_Program\Albatros\ 형태였으니 실 경로 확인 필요.
; 끝의 백슬래시는 자동 보정됨.
BasePath=C:\Albatros\

; 파생 경로 (참조용 - 코드에서 자동 계산):
;   <BasePath>\Report\ErrAsseXGVS\  ← Tier 1 데이터 소스
;   <BasePath>\Tmp\                  ← Tier 4 데이터 소스 (MONTH##.TER)

[Communication]
; ESP32 게이트웨이와 연결되는 시리얼 포트.
; PowerFlex PC 에서 비어있는 COM 포트를 'mode' 명령으로 미리 확인.
; AH221 은 COM11, GA3 는 COM6 사용 — PowerFlex 는 별도 지정.
COM_Port=COM4
BaudRate=115200

[Agent]
; 메인 타이머 인터벌 (밀리초). 모든 Tier 의 기준 사이클.
; 변경하면 PollIntervals 의 cycle 계산도 자동으로 따라옴.
TimeInterval=5000

[PollIntervals]
; Tier 1 — ErrAsseXGVS 파일 (축 위치/상태)
AxisStatus=5
AxisStatus_Enabled=true

; Tier 4 — MONTH##.TER 파일 (가동 통계)
MonthlyReport=60
MonthlyReport_Enabled=true

; ===========================================================================
;  [Notes]
;
;  * 1차 배포에서는 위 2개 그룹만 활성. Tier 2 (ErrAxEthercat) / Tier 3
;    (ERRCAN.TXT, ERRECAT.TXT) 는 코드 확장 후 추가될 예정.
;
;  * AxisStatus 폴링 주기를 낮추려면 (예: 1초) TimeInterval=1000 으로 변경.
;    단, ESP32 측 처리 속도와 시리얼 대역폭 고려 필요.
;
;  * 운영 중 INI 를 변경했다면 서비스 재시작 필요 (services.msc 또는
;    'net stop SCM_PowerflexAgent && net start SCM_PowerflexAgent').
; ===========================================================================
