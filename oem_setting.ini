; ===========================================================================
;  SCM-PowerFlex Agent Service - Configuration  (Tier4 재지향판 2026-06-03)
;  Target: Morbidelli PWX100 + TPA Albatros 3.1.9 SP 9c
;  Place this file beside SCM_PowerflexAgent.exe
; ===========================================================================

[Albatros]
; Albatros 설치 루트 경로. (Tier1 ErrAsseXGVS, Tier4 폴백 MONTH##.TER 용)
BasePath=C:\Albatros\

[Communication]
COM_Port=COM4
BaudRate=115200

[Agent]
; 메인 타이머 인터벌 (밀리초). 모든 Tier 의 기준 사이클.
TimeInterval=5000

[PowerProductionReport]
; ★ Tier4 신규 소스 (실 생산데이터 CSV).
;   PowerInterface 가 생성하는 일별 CSV: <BasePath>\pro\YYYY\YYYYMM\YYYYMMDD.csv
;   라이브 머신마다 위치가 다를 수 있으니 실 경로 확인 후 지정.
;   기본값은 표준 설치 경로. 끝 백슬래시는 자동 보정.
BasePath=C:\Report_PI\PowerProductionReport\
; true=CSV 우선 사용(없는 날은 MONTH.TER 자동 폴백). false=항상 MONTH.TER.
Enabled=true

[PollIntervals]
; Tier 1 — ErrAsseXGVS 파일 (축 위치/상태)
AxisStatus=5
AxisStatus_Enabled=true

; Tier 4 — 가동/생산 통계 (PowerProductionReport CSV 우선, MONTH##.TER 폴백)
MonthlyReport=60
MonthlyReport_Enabled=true

; ===========================================================================
;  [Notes]
;
;  * Tier4 동작: 매 폴링마다 오늘자 PowerProductionReport CSV 를 먼저 시도.
;    - CSV 존재(PowerInterface 실행된 날) -> 실 생산데이터로 ID 10~13 채움
;        ID10 MachineState 1=RUN 2=READY 3=NOT_READY 4=EMERGENCY 5=ALARM
;        ID11 DailyRunTimeMin (실 가공시간)  ID12 DailyPartCount (실 생산량)
;        ID13 DailyAlarmCount (실 알람수)
;    - CSV 없음 -> 기존 MONTH##.TER 로 폴백(HMI 가용성 최소정보)
;
;  * PowerProductionReport.BasePath 는 실 머신에서 폴더 위치를 반드시 확인할 것.
;    (C:\Report_PI\ 가 없으면 PowerInterface 미실행이거나 다른 경로일 수 있음)
;
;  * INI 변경 후 서비스 재시작 필요.
; ===========================================================================
